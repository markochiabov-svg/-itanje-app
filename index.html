<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nauči Čitati</title>
  
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/owl.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Overlays */
    #start-overlay, #victory-overlay, #map-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 20px;
    }
    #victory-overlay {
      display: none;
      background: rgba(248, 250, 252, 0.96);
      text-align: center;
      padding: 20px;
      z-index: 105;
    }
    #map-overlay {
      display: none;
      background: #0f172a;
      color: white;
    }

    .main-btn {
      background: var(--success);
      color: white;
      border: none;
      font-size: 24px;
      font-weight: 900;
      padding: 18px 36px;
      border-radius: 24px;
      box-shadow: 0 6px 0 #15803d;
      cursor: pointer;
    }
    .main-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #15803d;
    }

    /* Dizajn karte */
    .map-container {
      position: relative;
      width: 300px;
      height: 420px;
      margin: 20px 0;
    }
    .map-node {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #64748b;
      border: 4px solid #475569;
      z-index: 2;
      transition: all 0.4s ease;
    }
    .map-node.unlocked { background: var(--primary); color: white; border-color: #60a5fa; }
    .map-node.active { background: var(--success); color: white; border-color: #4ade80; animation: pulseNode 1.5s infinite; transform: scale(1.15); }
    .map-node.completed { background: #facc15; border-color: #eab308; }
    
    @keyframes pulseNode {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    /* Pozicije otoka */
    #node-0 { bottom: 0; left: 10%; }
    #node-1 { bottom: 20%; right: 10%; }
    #node-2 { bottom: 45%; left: 15%; }
    #node-3 { bottom: 70%; right: 15%; }
    #node-4 { top: 0; left: 50%; transform: translateX(-50%); font-size: 34px;}

    /* Traka napretka (Krugovi) */
    #progress-tracker {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .progress-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 3px solid #cbd5e1;
      transition: all 0.3s ease;
    }
    .progress-dot.active {
      background: #facc15;
      border-color: #eab308;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      transform: scale(1.2);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 440px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex-shrink: 0;
      border: none;
      background: #e2e8f0;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: bold;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }
    .stage.active { display: flex; }

    /* MATEMATIČKI SAVRŠEN RAZMAK SLOVA */
    .word-preview {
      display: flex;
      justify-content: space-between;
      width: 100%;
      /* Ostavlja točno 28px s obje strane kako bi prvo slovo bilo na nuli hoda, a zadnje na 100% hoda zvjezdice */
      padding: 0 28px; 
      margin: 20px 0;
      min-height: 70px;
      align-items: center;
    }

    .letter-node {
      font-size: 40px;
      font-weight: 900;
      padding: 8px 0px;
      border-radius: 12px;
      color: #94a3b8;
      transition: all 0.15s ease;
    }
    .letter-node.active {
      color: var(--primary);
      transform: scale(1.25) translateY(-6px);
      text-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .track-container {
      width: 100%;
      height: 56px;
      background: #e2e8f0;
      border-radius: 28px;
      position: relative;
      margin: 20px 0 15px;
      display: flex;
      align-items: center;
      padding: 4px;
      touch-action: none;
    }
    
    #sliderProgress {
      position: absolute;
      left: 4px;
      top: 4px;
      bottom: 4px;
      width: 48px;
      background: linear-gradient(90deg, #60a5fa, #3b82f6);
      border-radius: 24px;
      pointer-events: none;
    }

    .slider-handle {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      left: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      touch-action: none;
    }

    /* FAZA 2 - Mikrofon */
    .result-display {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      margin: 15px 0;
      border: 3px solid #e2e8f0;
      transition: all 0.3s ease;
    }
    .result-display.hidden-content { filter: blur(14px); opacity: 0.3; }

    .mic-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: #e2e8f0;
      color: #334155;
      font-size: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      transition: all 0.2s ease;
    }
    .mic-button.listening { background: var(--danger); color: #ffffff; animation: pulse 1.2s infinite; }
    .mic-button.success { background: var(--success); color: #ffffff; transform: scale(1.08); }

    .status-text { font-size: 16px; font-weight: 700; color: #64748b; margin: 8px 0; min-height: 26px; text-align: center; }
    .heard-text { font-size: 15px; color: #0ea5e9; font-style: italic; min-height: 20px; margin-bottom: 8px; }

    /* FAZA 3 - Slaganje */
    .slot-container, .tray-container {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      min-height: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .char-box {
      width: 52px;
      height: 60px;
      border-radius: 12px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      border-bottom: 4px solid #cbd5e1;
      color: #1e293b;
    }
    .char-box.filled { border-bottom-color: var(--success); color: var(--success); }

    .char-tile {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      box-shadow: 0 4px 0 #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
    }
    .char-tile:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }

    .action-btn {
      background: var(--success);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
    .bypass-btn {
      background: transparent; border: none; color: #94a3b8; font-size: 13px; text-decoration: underline; cursor: pointer; margin-top: 8px; display: none;
    }

    .nav-controls { display: flex; justify-content: space-between; width: 100%; margin-top: 5px; }
    .nav-arrow { background: transparent; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 10px; color: #64748b; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Ekran za pokretanje -->
  <div id="start-overlay">
    <div style="font-size: 60px;">🦉</div>
    <button class="main-btn" onclick="initApp()">POKRENI IGRU ▶️</button>
  </div>

  <!-- Karta s progresijom (Novi Svijet) -->
  <div id="map-overlay">
    <h1 style="font-size: 32px; font-weight: 900; margin-bottom: 10px;">Karta Čitanja</h1>
    <p style="color: #94a3b8; margin-bottom: 30px;">Prijeđi sve otoke do blaga!</p>
    
    <div class="map-container">
      <svg viewBox="0 0 300 420" style="position:absolute; width:100%; height:100%; z-index:1;">
        <path d="M 40 420 C 120 400, 250 380, 260 330 C 270 280, 80 260, 60 230 C 40 200, 250 160, 250 120 C 250 80, 150 50, 150 20" fill="transparent" stroke="#334155" stroke-width="8" stroke-dasharray="12, 12"/>
      </svg>
      <div class="map-node" id="node-0">1</div>
      <div class="map-node" id="node-1">2</div>
      <div class="map-node" id="node-2">3</div>
      <div class="map-node" id="node-3">4</div>
      <div class="map-node" id="node-4">👑</div>
    </div>
    
    <button class="main-btn" id="playLevelBtn" onclick="startLevel()" style="margin-top: 20px; z-index: 10;">IGRAJ RAZINU</button>
  </div>

  <!-- Pobjednički ekran nakon pojedinog otoka -->
  <div id="victory-overlay">
    <div style="font-size: 80px; animation: pulse 1s infinite alternate;">🏆</div>
    <h1 style="font-size: 32px; font-weight: 900; color: #eab308; margin: 10px 0;">RAZINA ZAVRŠENA!</h1>
    <p style="font-size: 18px; color: #475569; max-width: 280px; margin-bottom: 20px;">Sjajno si pročitao sve riječi!</p>
    <button class="main-btn" onclick="returnToMap()">NASTAVI NA KARTU 🗺️</button>
  </div>

  <!-- Traka napretka -->
  <div id="progress-tracker"></div>

  <!-- Kategorije -->
  <div class="nav-tabs" id="categoryNav"></div>

  <!-- Glavna kartica s igrom -->
  <div class="card">
    <div class="nav-controls">
      <button class="nav-arrow" id="prevWordBtn">← Prethodna</button>
      <button class="nav-arrow" id="nextWordBtn">Sljedeća →</button>
    </div>

    <!-- 1. FAZA: SLAJDER -->
    <div class="stage active" id="stageSlider">
      <div class="word-preview" id="sliderWordBox"></div>
      <div class="track-container" id="track">
        <div id="sliderProgress"></div>
        <div class="slider-handle" id="sliderHandle">⭐</div>
      </div>
      <div class="status-text">Povuci zvjezdicu lijevo-desno 👉</div>
    </div>

    <!-- 2. FAZA: MIKROFON -->
    <div class="stage" id="stageMic">
      <div class="result-display hidden-content" id="micMysteryImage">?</div>
      <button class="mic-button" id="micBtn">🎤</button>
      <div class="status-text" id="micStatusText">Klikni mikrofon i reci riječ!</div>
      <div class="heard-text" id="heardText"></div>
      <button class="action-btn" id="goToSpellBtn">Složi slova ➔</button>
      <button class="bypass-btn" id="bypassBtn">Preskoči izgovor ➔</button>
    </div>

    <!-- 3. FAZA: SLAGANJE SLOVA -->
    <div class="stage" id="stageSpelling">
      <div class="result-display" id="spellImage">?</div>
      <div class="slot-container" id="slotContainer"></div>
      <div class="tray-container" id="trayContainer"></div>
      <div class="status-text" id="spellStatus">Poredaj slova po redu</div>
      <button class="action-btn" id="restartBtn">Sljedeća riječ ➔</button>
    </div>
  </div>

  <script>
    const DATA = {
      "Životinje": [
        { word: "vuk", icon: "🐺" }, { word: "pas", icon: "🐶" }, { word: "lav", icon: "🦁" },
        { word: "konj", icon: "🐴" }, { word: "riba", icon: "🐟" }, { word: "miš", icon: "🐭" },
        { word: "koza", icon: "🐐" }, { word: "krava", icon: "🐄" }, { word: "ptica", icon: "🐦" },
        { word: "jež", icon: "🦔" }, { word: "rak", icon: "🦀" }, { word: "zmaj", icon: "🐉" }
      ],
      "Hrana": [
        { word: "sir", icon: "🧀" }, { word: "med", icon: "🍯" }, { word: "kruh", icon: "🍞" },
        { word: "meso", icon: "🥩" }, { word: "jaje", icon: "🥚" }, { word: "sok", icon: "🧃" },
        { word: "voda", icon: "💧" }, { word: "pita", icon: "🥧" }, { word: "torta", icon: "🎂" }
      ],
      "Vozila": [
        { word: "auto", icon: "🚗" }, { word: "vlak", icon: "🚂" }, { word: "brod", icon: "🚢" },
        { word: "bager", icon: "🚜" }, { word: "avion", icon: "✈️" }, { word: "čamac", icon: "🛶" }
      ],
      "Halloween": [
        { word: "duh", icon: "👻" }, { word: "sova", icon: "🦉" }, { word: "pauk", icon: "🕷️" },
        { word: "kost", icon: "🦴" }, { word: "mrak", icon: "🌑" }, { word: "kotao", icon: "🥣" }
      ],
      "Tijelo": [
        { word: "oko", icon: "👁️" }, { word: "uho", icon: "👂" }, { word: "nos", icon: "👃" },
        { word: "zub", icon: "🦷" }, { word: "ruka", icon: "✋" }, { word: "noga", icon: "🦶" }
      ]
    };

    let currentCategory = "Životinje";
    let wordIndex = 0;
    let graphemes = [];
    let placedLetters = [];
    
    let currentMapLevel = 0; 
    let solvedInLevel = 0;
    
    let isDragging = false;
    let lastActiveIndex = -1;
    let lastSpokenTime = 0;

    function getTargetForLevel() { return 3 + currentMapLevel; }

    function splitGraphemes(word) {
      const lower = word.toLowerCase();
      const res = [];
      for (let i = 0; i < lower.length; i++) {
        if (i < lower.length - 1) {
          const pair = lower[i] + lower[i+1];
          if (pair === "lj" || pair === "nj" || pair === "dž") {
            res.push(pair);
            i++;
            continue;
          }
        }
        res.push(lower[i]);
      }
      return res;
    }

    let audioCtx = null;
    let audioUnlocked = false;

    function initAllAudio() {
      if (audioUnlocked) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      try {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch(e) {}

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance("Kreni!");
        u.lang = 'hr-HR';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
      audioUnlocked = true;
    }

    function playTone(freq, dur) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.25), idx * 140);
      });
    }

    const phonemeMap = {
      'š': 'š.', 'č': 'č.', 'ć': 'ć.', 'ž': 'ž.', 'đ': 'đ.',
      'lj': 'lj', 'nj': 'nj', 'dž': 'dž'
    };

    function speakText(text, rate = 0.85, onComplete = null) {
      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = phonemeMap[text.toLowerCase()] ? phonemeMap[text.toLowerCase()] : text;
      const u = new SpeechSynthesisUtterance(cleanText);
      u.lang = 'hr-HR';
      u.rate = rate;
      if (onComplete) { u.onend = () => onComplete(); u.onerror = () => onComplete(); }
      window.speechSynthesis.speak(u);
    }

    function initApp() {
      initAllAudio();
      playTone(523.25, 0.15);
      document.getElementById('start-overlay').style.display = 'none';
      renderMap();
      document.getElementById('map-overlay').style.display = 'flex';
    }

    function renderMap() {
      for(let i=0; i<5; i++) {
        const node = document.getElementById(`node-${i}`);
        node.className = "map-node";
        if (i < currentMapLevel) {
          node.classList.add("completed");
          if(i === 4) node.innerText = "👑"; else node.innerText = "✓";
        } else if (i === currentMapLevel) {
          node.classList.add("active");
          if(i === 4) node.innerText = "👑"; else node.innerText = (i+1).toString();
        } else {
          if(i === 4) node.innerText = "👑"; else node.innerText = (i+1).toString();
        }
      }
      
      const btn = document.getElementById("playLevelBtn");
      if (currentMapLevel >= 5) {
        btn.innerText = "POČNI IGRU ISPOČETKA";
        btn.onclick = () => { currentMapLevel = 0; renderMap(); };
      } else {
        btn.innerText = `IGRAJ RAZINU ${currentMapLevel + 1} ▶️`;
        btn.onclick = startLevel;
      }
    }

    function startLevel() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('map-overlay').style.display = 'none';
      solvedInLevel = 0;
      
      const tracker = document.getElementById("progress-tracker");
      tracker.innerHTML = "";
      const target = getTargetForLevel();
      for(let i=0; i < target; i++) {
        const dot = document.createElement("div");
        dot.className = "progress-dot";
        tracker.appendChild(dot);
      }
      
      const categories = Object.keys(DATA);
      currentCategory = categories[Math.floor(Math.random() * categories.length)];
      updateCategoryTabs();
      
      DATA[currentCategory].sort(() => Math.random() - 0.5);
      wordIndex = 0;
      loadWord();
    }

    function updateCategoryTabs() {
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.innerText === currentCategory) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function updateTracker() {
      const dots = document.querySelectorAll('.progress-dot');
      dots.forEach((dot, idx) => {
        if (idx < solvedInLevel) dot.classList.add('active');
        else dot.classList.remove('active');
      });
    }

    function returnToMap() {
      document.getElementById('victory-overlay').style.display = 'none';
      currentMapLevel++;
      renderMap();
      document.getElementById('map-overlay').style.display = 'flex';
    }

    const categoryNav = document.getElementById("categoryNav");
    Object.keys(DATA).forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
      btn.innerText = cat;
      btn.onclick = () => {
        currentCategory = cat;
        updateCategoryTabs();
        DATA[currentCategory].sort(() => Math.random() - 0.5);
        wordIndex = 0;
        loadWord();
      };
      categoryNav.appendChild(btn);
    });

    document.getElementById("prevWordBtn").onclick = () => {
      const list = DATA[currentCategory];
      wordIndex = (wordIndex - 1 + list.length) % list.length;
      loadWord();
    };

    document.getElementById("nextWordBtn").onclick = () => {
      const list = DATA[currentCategory];
      wordIndex = (wordIndex + 1) % list.length;
      loadWord();
    };

    function loadWord() {
      const item = DATA[currentCategory][wordIndex];
      graphemes = splitGraphemes(item.word);
      placedLetters = [];

      showStage("stageSlider");

      const sliderBox = document.getElementById("sliderWordBox");
      sliderBox.innerHTML = "";
      graphemes.forEach((g, idx) => {
        const node = document.createElement("div");
        node.className = "letter-node";
        node.id = `node-${idx}`;
        node.innerText = g.toUpperCase();
        sliderBox.appendChild(node);
      });

      resetSliderHandle();

      const micImg = document.getElementById("micMysteryImage");
      micImg.innerText = item.icon;
      micImg.className = "result-display hidden-content";

      const micBtn = document.getElementById("micBtn");
      micBtn.className = "mic-button";
      micBtn.innerText = "🎤";
      document.getElementById("micStatusText").innerText = "Klikni mikrofon i reci riječ!";
      document.getElementById("heardText").innerText = "";
      document.getElementById("goToSpellBtn").style.display = "none";
      document.getElementById("bypassBtn").style.display = "none";

      document.getElementById("spellImage").innerText = item.icon;
      setupSpellingStage();
    }

    function showStage(stageId) {
      document.querySelectorAll(".stage").forEach(s => s.classList.remove("active"));
      document.getElementById(stageId).classList.add("active");
    }

    function resetSliderHandle() {
      handle.style.left = "4px";
      progressFill.style.width = "48px";
      lastActiveIndex = -1;
      lastSpokenTime = 0;
      document.querySelectorAll(".letter-node").forEach(n => n.classList.remove("active"));
    }

    function handleStart(e) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      isDragging = true;
      handleMove(e);
    }

    // NOVA OPTIMIZIRANA LOGIKA (BEZ RUŠENJA DOM-a I SA ZAŠTITOM OD SCROLLA)
    function handleMove(e) {
      if (!isDragging) return;
      
      // Sprječava Safariju da ukrade dodir kao "scroll" akciju!
      if (e.cancelable) e.preventDefault(); 

      const rect = track.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const minX = 4;
      const maxX = rect.width - 52;
      let currentX = clientX - rect.left - 24;

      if (currentX < minX) currentX = minX;
      if (currentX > maxX) currentX = maxX;

      handle.style.left = currentX + "px";
      progressFill.style.width = (currentX + 48) + "px";

      // Progress ide strogo od 0.0 (početak) do 1.0 (kraj)
      const progress = (currentX - minX) / (maxX - minX);

      // Matematički izračunavamo ispod kojeg smo točno slova (umjesto čitanja DOM-a)
      let index = -1;
      const numLetters = graphemes.length;
      if (numLetters > 1) {
        index = Math.round(progress * (numLetters - 1));
      } else if (numLetters === 1) {
        index = 0;
      }

      const now = Date.now();
      if (index !== -1 && index !== lastActiveIndex && (now - lastSpokenTime > 100)) {
        lastActiveIndex = index;
        lastSpokenTime = now;

        document.querySelectorAll(".letter-node").forEach((n, i) => {
          if (i === index) {
            n.classList.add("active");
            playTone(400 + (i * 80), 0.1);
            speakText(graphemes[i]);
          } else {
            n.classList.remove("active");
          }
        });
      }

      // Ako je došao do samog kraja, prebaci fazu
      if (progress >= 0.98) {
        isDragging = false;
        playTone(587.33, 0.15);
        setTimeout(() => {
          showStage("stageMic");
          setTimeout(() => {
            const bypass = document.getElementById("bypassBtn");
            if (!document.getElementById("micBtn").classList.contains("success")) {
              bypass.style.display = "block";
            }
          }, 3000);
        }, 350);
      }
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;
      const rect = track.getBoundingClientRect();
      const currentPos = parseFloat(handle.style.left || 0);
      // Ako korisnik pusti prije 94%, zvjezdica se vraća na početak
      if (currentPos / (rect.width - 52) < 0.94) {
        resetSliderHandle();
      }
    }

    // Registracija dodira s { passive: false } da allow-a preventDefault()!
    track.addEventListener("mousedown", handleStart);
    window.addEventListener("mousemove", handleMove, { passive: false });
    window.addEventListener("mouseup", handleEnd);
    track.addEventListener("touchstart", handleStart, { passive: false });
    window.addEventListener("touchmove", handleMove, { passive: false });
    window.addEventListener("touchend", handleEnd);

    // 2. FAZA: MIKROFON
    const micBtn = document.getElementById("micBtn");
    const micStatus = document.getElementById("micStatusText");
    const heardText = document.getElementById("heardText");
    const micMysteryImage = document.getElementById("micMysteryImage");
    const goToSpellBtn = document.getElementById("goToSpellBtn");
    const bypassBtn = document.getElementById("bypassBtn");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'hr-HR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        micBtn.className = "mic-button listening";
        micStatus.innerText = "Slušam te... reci riječ!";
        heardText.innerText = "";
      };

      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        transcript = transcript.trim().toLowerCase();
        heardText.innerText = `Čujem: "${transcript}"`;

        const target = DATA[currentCategory][wordIndex].word.toLowerCase();
        if (transcript === target || transcript.includes(target)) {
          try { recognition.stop(); } catch(e){}
          onSpeechSuccess();
        }
      };

      recognition.onerror = () => {
        micBtn.className = "mic-button";
        micStatus.innerText = "Nisam dobro čuo. Probaj opet.";
        bypassBtn.style.display = "block";
      };

      recognition.onend = () => {
        if (!micBtn.classList.contains("success")) {
          micBtn.classList.remove("listening");
        }
      };
    }

    micBtn.onclick = () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (!SpeechRecognition) {
        micStatus.innerText = "Mikrofon nije podržan na ovom pretraživaču.";
        bypassBtn.style.display = "block";
        return;
      }
      try {
        recognition.start();
      } catch (err) {
        recognition.stop();
        setTimeout(() => { try { recognition.start(); } catch(e){} }, 150);
      }
    };

    bypassBtn.onclick = () => onSpeechSuccess();

    function onSpeechSuccess() {
      micBtn.className = "mic-button success";
      micBtn.innerText = "✓";
      micStatus.innerText = "Točno! Bravo!";
      micMysteryImage.className = "result-display";
      bypassBtn.style.display = "none";
      playTone(659.25, 0.2); 
      speakText(DATA[currentCategory][wordIndex].word);
      goToSpellBtn.style.display = "block";
    }

    goToSpellBtn.onclick = () => showStage("stageSpelling");

    // 3. FAZA: SLAGANJE SLOVA
    function setupSpellingStage() {
      const slotContainer = document.getElementById("slotContainer");
      const trayContainer = document.getElementById("trayContainer");
      slotContainer.innerHTML = "";
      trayContainer.innerHTML = "";
      placedLetters = [];
      document.getElementById("spellStatus").innerText = "Poredaj slova po redu";
      document.getElementById("restartBtn").style.display = "none";

      graphemes.forEach((_, idx) => {
        const slot = document.createElement("div");
        slot.className = "char-box";
        slot.id = `slot-${idx}`;
        slotContainer.appendChild(slot);
      });

      const shuffled = [...graphemes]
        .map((g) => ({ g, rand: Math.random() }))
        .sort((a, b) => a.rand - b.rand);

      shuffled.forEach((item, i) => {
        const tile = document.createElement("div");
        tile.className = "char-tile";
        tile.innerText = item.g.toUpperCase();
        tile.id = `tile-${i}`;
        tile.onclick = () => onTileClick(tile, item.g);
        trayContainer.appendChild(tile);
      });
    }

    function onTileClick(tile, letter) {
      if (tile.style.visibility === "hidden") return;

      const nextSlotIndex = placedLetters.length;
      if (nextSlotIndex >= graphemes.length) return;

      if (letter === graphemes[nextSlotIndex]) {
        placedLetters.push(letter);
        tile.style.visibility = "hidden";

        const slot = document.getElementById(`slot-${nextSlotIndex}`);
        slot.innerText = letter.toUpperCase();
        slot.classList.add("filled");
        playTone(520 + (nextSlotIndex * 90), 0.12);

        const isLastLetter = placedLetters.length === graphemes.length;

        if (isLastLetter) {
          speakText(letter, 0.85, () => {
            setTimeout(() => {
              document.getElementById("spellStatus").innerText = "Bravo! Sve je točno!";
              speakText(DATA[currentCategory][wordIndex].word, 0.85);
              
              solvedInLevel++;
              updateTracker();

              if (solvedInLevel >= getTargetForLevel()) {
                setTimeout(() => {
                  document.getElementById('victory-overlay').style.display = 'flex';
                  playFanfare();
                }, 1000);
              } else {
                document.getElementById("restartBtn").style.display = "block";
              }
            }, 500);
          });
        } else {
          speakText(letter);
        }
      } else {
        playTone(180, 0.2);
        tile.style.transform = "translateX(-6px)";
        setTimeout(() => tile.style.transform = "translateX(6px)", 80);
        setTimeout(() => tile.style.transform = "translateX(0)", 160);
        
        setTimeout(() => {
          speakText("Pokušaj ponovno");
          document.getElementById("spellStatus").innerText = "Ups! Idemo ispočetka!";
          placedLetters = []; 
          
          document.querySelectorAll('.char-box').forEach(slot => {
            slot.innerText = "";
            slot.classList.remove("filled");
          });
          document.querySelectorAll('.char-tile').forEach(t => {
            t.style.visibility = "visible";
            t.classList.remove("used");
          });
        }, 500);
      }
    }

    document.getElementById("restartBtn").onclick = () => {
      document.getElementById("nextWordBtn").click();
    };

  </script>
</body>
